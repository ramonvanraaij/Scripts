# =================================================================
# Example configuration for apk-autoupdate-cron
# =================================================================
#
# Install path:
#   /etc/apk-autoupdate-cron.conf
#
# Secure the file before it is installed, the script only reads it when it
# is owned by root and is neither group- nor world-writable:
#   chown root:root /etc/apk-autoupdate-cron.conf
#   chmod 600 /etc/apk-autoupdate-cron.conf
#
# Every value below is a placeholder: replace the example addresses with the
# real ones. A file that does not exist is simply skipped, so this
# configuration is entirely optional.
#
# The file is sourced by the shell, so it may only contain variable
# assignments and comments.
# Only the variables that are documented here are read from it.
# =================================================================

# --- Logging ---

# File that receives the timestamped output of every run.
LOG_FILE="/var/log/apk-autoupdate.log"

# Command that performs the update. The value is a command line, so
# arguments and quotes are allowed.
UPDATE_CMD="apk-autoupdate"

# --- Email Alert ---

# Set to "false" to log the failure without sending an email.
EMAIL_ENABLED="true"

# Recipient and sender of the failure alert.
EMAIL_TO="admin@example.com"
EMAIL_FROM="apk-autoupdate@example.com"

# Mail command used to deliver the alert.
SENDMAIL_CMD="/usr/sbin/sendmail"

# Number of lines of the output of the failing run that are included in the
# alert.
LOG_TAIL_LINES="40"

# --- Monit ---

# The active monit system configuration.
MONIT_ACTIVE_CONF="/etc/monit.d/system.conf"

# The monit configuration with the raised system load alert levels. It is
# installed for the duration of the update.
MONIT_UPDATE_CONF="/etc/monit.d/system.conf.update"

# The normal monit configuration. It is restored after the update, also when
# the update fails.
MONIT_DEFAULT_CONF="/etc/monit.d/system.conf.default"
